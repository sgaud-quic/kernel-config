---
# Phase 1 of the kernel topic promotion flow.
#
# First CI stage for every change to the SHA-pinned qcom-next configuration.
# Runs the structural validator (V1-V5, V8), then the diff-based change
# classifier (V6 scope, V7 freeze), and publishes the result as a PR check,
# a job summary and a sticky PR comment.
#
# Outputs consumed by later phases:
#   classification   rc-uprev | topic-promotion | atomic-topic-promotion |
#                    metadata-only | rerere-only | no-change | invalid-mixed-change
#   publish_allowed  whether the promotion freeze permits publication
#   promoted_topics  comma-separated topic names whose sha/tag moved
#   required_gates   human-readable gate profile for this change class
name: Validate qcom-next config

on:
  pull_request:
    branches: [main, ci-v2]
    paths:
      - qcom-next.yaml
      - schemas/qcom-next.schema.json
      - scripts/**
      - topic_maintainers.json
      - .github/actions/sync/action.yml
      - .github/workflows/validate-qcom-next-config.yml
      - .github/workflows/qcom-next-pr-ci.yml
      - .github/workflows/prune-qcom-next-candidates.yml
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base ref to diff against (default: the PR base, or main)"
        type: string
        required: false
      allow_untagged:
        description: "Downgrade missing-tag errors to warnings (migration default: on)"
        type: boolean
        default: true
      allow_atomic_override:
        description: Permit a multi-topic promotion that depends_on does not justify
        type: boolean
        default: false
  workflow_call:
    inputs:
      base_ref:
        type: string
        required: false
      allow_untagged:
        type: boolean
        default: true
      allow_atomic_override:
        type: boolean
        default: false
    outputs:
      classification:
        description: Change class determined by the classifier
        value: ${{ jobs.validate.outputs.classification }}
      publish_allowed:
        description: Whether publication is permitted (promotion freeze honoured)
        value: ${{ jobs.validate.outputs.publish_allowed }}
      promoted_topics:
        description: Comma-separated topics whose sha/tag changed
        value: ${{ jobs.validate.outputs.promoted_topics }}
      required_gates:
        description: Gate profile required for this change class
        value: ${{ jobs.validate.outputs.required_gates }}

# Least privilege at the workflow level: only the validate job comments on the
# PR, so it requests write access itself.
permissions:
  contents: read

concurrency:
  # One validation run per PR; superseded pushes are cancelled because only the
  # newest config revision matters.
  group: validate-qcom-next-config-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and classify
    runs-on: ubuntu-latest
    # Scoped here rather than workflow-wide: this is the only job that writes
    # to the PR. A fork PR gets read-only regardless, which the step handles.
    permissions:
      contents: read
      pull-requests: write
    outputs:
      classification: ${{ steps.classify.outputs.classification }}
      publish_allowed: ${{ steps.classify.outputs.publish_allowed }}
      promoted_topics: ${{ steps.classify.outputs.promoted_topics }}
      required_gates: ${{ steps.classify.outputs.required_gates }}

    steps:
      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          # Full history so the classifier can read the base revision of the
          # config with `git show <base>:qcom-next.yaml`.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pyyaml jsonschema

      - name: Resolve base ref
        id: base
        env:
          INPUT_BASE_REF: ${{ inputs.base_ref }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_BASE_REF:-}" ]; then
            base="${INPUT_BASE_REF}"
          elif [ -n "${PR_BASE_REF:-}" ]; then
            base="origin/${PR_BASE_REF}"
          else
            base="origin/main"
          fi
          git fetch --quiet origin "${base#origin/}" || true
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            echo "::error title=qcom-next config::base ref '$base' could not be resolved"
            exit 1
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "Base ref: $base ($(git rev-parse --short "$base"))"

      - name: Run tooling self-tests
        # Guards the validator and classifier themselves. A broken rule engine
        # would otherwise silently pass every config.
        run: python scripts/selftest_qcom_next_config.py

      - name: Run CI wiring self-tests
        # Static checks on the Phase 3 workflow graph, the sync action's repo
        # handling, and the gate status contract. GitHub Actions cannot be run
        # here, so these catch the structural breakages instead.
        run: python scripts/selftest_qcom_next_ci.py

      - name: Validate config (V1-V5, V8)
        id: validate
        env:
          # Input defaults do not apply to the pull_request trigger, where
          # there are no inputs at all, so coalesce explicitly. During the
          # migration the default is on: 46 of 50 topics have no conventional
          # tag yet, and without this every config PR would fail on the tag
          # backlog rather than on anything it changed. This only affects tags;
          # an unpinned sha is rejected regardless (V5).
          ALLOW_UNTAGGED: ${{ inputs.allow_untagged == null && 'true' || inputs.allow_untagged }}
        run: |
          set -euo pipefail
          args=(--config qcom-next.yaml
                --schema schemas/qcom-next.schema.json
                --maintainers topic_maintainers.json
                --format github
                --markdown-out validate-summary.md)
          if [ "${ALLOW_UNTAGGED:-true}" = "true" ]; then
            args+=(--allow-untagged)
            echo "::notice title=qcom-next config::running with --allow-untagged (migration mode)"
          fi
          set +e
          python scripts/validate_qcom_next_config.py "${args[@]}"
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Classify change (V6 scope, V7 freeze)
        id: classify
        if: ${{ always() && steps.validate.outcome == 'success' }}
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
          ALLOW_ATOMIC: ${{ inputs.allow_atomic_override }}
        run: |
          set -euo pipefail
          args=(--base-ref "$BASE_REF"
                --config qcom-next.yaml
                --format text
                --markdown-out classify-summary.md)
          if [ "${ALLOW_ATOMIC:-false}" = "true" ]; then
            args+=(--allow-atomic-override)
            echo "::notice title=qcom-next config::atomic override enabled by integration owner"
          fi
          set +e
          python scripts/classify_qcom_next_change.py "${args[@]}"
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::error title=qcom-next config::change rejected or blocked by the promotion freeze"
          fi
          exit $rc

      - name: Build job summary
        if: ${{ always() }}
        env:
          BASE_REF_USED: ${{ steps.base.outputs.ref }}
          VALIDATION: ${{ steps.validate.outcome }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          PUBLISH_ALLOWED: ${{ steps.classify.outputs.publish_allowed }}
          REQUIRED_GATES: ${{ steps.classify.outputs.required_gates }}
        run: |
          {
            echo "## qcom-next config validation"
            echo ""
            if [ -f validate-summary.md ]; then
              cat validate-summary.md
              echo ""
            fi
            if [ -f classify-summary.md ]; then
              cat classify-summary.md
              echo ""
            fi
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Base ref | \`${BASE_REF_USED:-n/a}\` |"
            echo "| Validation | \`${VALIDATION:-n/a}\` |"
            echo "| Classification | \`${CLASSIFICATION:-n/a}\` |"
            echo "| Publication allowed | \`${PUBLISH_ALLOWED:-n/a}\` |"
            echo "| Required gates | ${REQUIRED_GATES:-n/a} |"
            echo "| Workflow run | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qcom-next-config-validation
          path: |
            validate-summary.md
            classify-summary.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Comment result on PR
        # A pull request from a fork always gets a read-only GITHUB_TOKEN,
        # regardless of the permissions block above, so posting a comment is
        # impossible there and returns 403. Skip it rather than fail a run whose
        # actual checks passed; the job summary carries the same content.
        # continue-on-error covers any further permission surprise.
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          VALIDATION: ${{ steps.validate.outcome }}
          CLASSIFICATION: ${{ steps.classify.outputs.classification }}
          PUBLISH_ALLOWED: ${{ steps.classify.outputs.publish_allowed }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- qcom-next-config-validation -->';
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            // Values arrive through env rather than being interpolated into
            // this script body, so no workflow value can be parsed as code.
            // The expression delimiters cannot appear literally here: GitHub
            // evaluates them anywhere in the file, and an empty one is a
            // syntax error that makes the whole workflow unloadable.
            const validation = process.env.VALIDATION || 'unknown';
            const classification = process.env.CLASSIFICATION || 'n/a';
            const publishAllowed = process.env.PUBLISH_ALLOWED || 'n/a';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
                           `/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const ok = validation === 'success' && publishAllowed !== 'false';
            const heading = ok
              ? 'qcom-next config validation passed'
              : 'qcom-next config validation needs attention';

            const body = [
              marker,
              `## ${heading}`,
              '',
              `- Validation: \`${validation}\``,
              `- Classification: \`${classification}\``,
              `- Publication allowed: \`${publishAllowed}\``,
              `- [Full run](${runUrl})`,
              '',
              read('validate-summary.md'),
              '',
              read('classify-summary.md'),
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = existing.find((c) => c.body && c.body.includes(marker));

            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

      - name: Note why no comment was posted
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::notice title=qcom-next config::PR is from a fork, so GITHUB_TOKEN is read-only and no comment was posted. The job summary above has the full result."

  generation-selftests:
    # Guards the SHA-pinned tree generator. It runs entirely against synthetic
    # local repositories, so it needs no access to kernel-topics and no network
    # beyond checking out automerge. Without this, a regression in the pinning
    # mechanism would only surface during a real integration run.
    name: Candidate generation self-tests
    runs-on: ubuntu-latest
    # Reads only; it never touches the PR.
    permissions:
      contents: read
    steps:
      - name: Checkout config repository
        uses: actions/checkout@v4

      - name: Checkout automerge
        uses: actions/checkout@v4
        with:
          repository: qualcomm-linux/automerge
          path: .automerge-checkout
          # Falls back to the default token for forks, where SPAT is unavailable.
          token: ${{ secrets.SPAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pyyaml

      - name: Report tool versions
        run: |
          git --version
          bash --version | head -1
          python3 --version

      - name: Run generation self-tests
        env:
          AUTOMERGE_DIR: ${{ github.workspace }}/.automerge-checkout
        run: |
          set -euo pipefail
          test -f "$AUTOMERGE_DIR/ci-merge" || {
            echo "::error title=qcom-next generation::ci-merge not found in the automerge checkout"
            exit 1
          }
          bash scripts/selftest_qcom_next_generate.sh

      - name: Verify the in-tree config projects cleanly
        # Cheap guard that the real 77-topic config can still be turned into the
        # artifacts the generator needs, without running a full merge.
        run: |
          set -euo pipefail
          python3 scripts/qcom_next_config.py ref-clashes
          python3 scripts/qcom_next_config.py merge-conf \
              --url-override file:///placeholder --output /tmp/merge.conf
          rows=$(grep -vc '^#' /tmp/merge.conf || true)
          echo "merge.conf rows: $rows"
          test "$(grep -c '^baseline' /tmp/merge.conf)" -eq 1
          python3 scripts/qcom_next_config.py tested-set --output /tmp/tested-set.txt
          python3 scripts/qcom_next_config.py digest /tmp/tested-set.txt
          fields=$(python3 scripts/qcom_next_config.py topics | awk -F'\t' '{print NF}' | sort -u)
          echo "topic field counts: $fields"
          test "$fields" = "5"

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "## qcom-next candidate generation self-tests"
            echo ""
            echo "Synthetic repositories exercise the pinning mechanism end to end:"
            echo "pinned SHAs are consumed, moved branch tips are ignored, and the"
            echo "tested-set digest is stable across runs."
          } >> "$GITHUB_STEP_SUMMARY"
