---
# Prunes the candidate refs created by qcom-next-pr-ci.yml.
#
# Each config PR run pushes a branch named
#
#     qcom-next-candidate/pr-<number>-<short-sha>
#
# to the candidate kernel repository. Those refs are build inputs with no value
# once their PR is closed, and left alone they accumulate indefinitely in a
# kernel-sized repository.
#
# A ref is deleted when its PR is closed or merged, or when it is older than
# --max-age-days, whichever comes first. Refs whose PR is still open are kept
# regardless of age, since publication may still need to re-verify them.
name: Prune qcom-next candidate refs

on:
  schedule:
    # 02:40 UTC daily, deliberately away from the nightly build window.
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      candidate_repo:
        description: Repository holding the candidate refs
        type: string
        default: qualcomm-linux-stg/kernel
        required: false
      max_age_days:
        description: Delete refs older than this many days even if the PR is open
        type: string
        default: '7'
        required: false
      dry_run:
        description: Report what would be deleted without deleting it
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: qcom-next-candidate-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale candidate refs
    runs-on: ubuntu-latest
    env:
      CANDIDATE_REPO: ${{ inputs.candidate_repo || 'qualcomm-linux-stg/kernel' }}
      MAX_AGE_DAYS: ${{ inputs.max_age_days || '7' }}
      # Scheduled runs default to actually deleting; manual runs default to a
      # dry run so an operator cannot delete a batch of refs by accident.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || 'false' }}
      GH_TOKEN: ${{ secrets.CANDIDATE_PAT || secrets.SPAT || github.token }}
    steps:
      - name: Prune
        run: |
          set -euo pipefail

          echo "candidate repo : $CANDIDATE_REPO"
          echo "max age (days) : $MAX_AGE_DAYS"
          echo "dry run        : $DRY_RUN"
          echo ""

          cutoff_epoch=$(( $(date -u +%s) - MAX_AGE_DAYS * 86400 ))

          # Paginate; a busy period can leave well over 100 candidate refs.
          refs=$(gh api --paginate \
                   "repos/${CANDIDATE_REPO}/git/matching-refs/heads/qcom-next-candidate/" \
                   --jq '.[].ref' 2>/dev/null || true)

          if [ -z "$refs" ]; then
            echo "no candidate refs found"
            exit 0
          fi

          total=0; kept=0; deleted=0; failed=0

          while read -r ref; do
            [ -n "$ref" ] || continue
            total=$((total + 1))
            branch="${ref#refs/heads/}"

            # qcom-next-candidate/pr-<number>-<short-sha>
            pr_number=$(printf '%s' "$branch" \
                        | sed -n 's#^qcom-next-candidate/pr-\([0-9]\{1,\}\)-.*#\1#p')

            sha=$(gh api "repos/${CANDIDATE_REPO}/git/${ref}" --jq '.object.sha' 2>/dev/null || echo "")
            commit_date=""
            if [ -n "$sha" ]; then
              commit_date=$(gh api "repos/${CANDIDATE_REPO}/commits/${sha}" \
                              --jq '.commit.committer.date' 2>/dev/null || echo "")
            fi

            age_epoch=0
            if [ -n "$commit_date" ]; then
              age_epoch=$(date -u -d "$commit_date" +%s 2>/dev/null || echo 0)
            fi

            reason=""
            if [ -n "$pr_number" ]; then
              state=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                        --jq '.state' 2>/dev/null || echo "unknown")
              case "$state" in
                closed) reason="PR #${pr_number} is closed" ;;
                open)
                  if [ "$age_epoch" -gt 0 ] && [ "$age_epoch" -lt "$cutoff_epoch" ]; then
                    reason="older than ${MAX_AGE_DAYS}d (PR #${pr_number} still open)"
                  fi
                  ;;
                *)
                  # Unknown PR state: fall back to age alone rather than
                  # deleting something that might still be in use.
                  if [ "$age_epoch" -gt 0 ] && [ "$age_epoch" -lt "$cutoff_epoch" ]; then
                    reason="older than ${MAX_AGE_DAYS}d (PR #${pr_number} state unknown)"
                  fi
                  ;;
              esac
            else
              if [ "$age_epoch" -gt 0 ] && [ "$age_epoch" -lt "$cutoff_epoch" ]; then
                reason="older than ${MAX_AGE_DAYS}d (no PR number in the ref name)"
              fi
            fi

            if [ -z "$reason" ]; then
              echo "keep   $branch"
              kept=$((kept + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete $branch - $reason"
              deleted=$((deleted + 1))
              continue
            fi

            if gh api -X DELETE "repos/${CANDIDATE_REPO}/git/${ref}" >/dev/null 2>&1; then
              echo "delete $branch - $reason"
              deleted=$((deleted + 1))
            else
              echo "FAILED to delete $branch"
              failed=$((failed + 1))
            fi
          done <<< "$refs"

          echo ""
          echo "total=$total kept=$kept deleted=$deleted failed=$failed"

          {
            echo "## qcom-next candidate ref prune"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Repository | \`$CANDIDATE_REPO\` |"
            echo "| Mode | $([ "$DRY_RUN" = "true" ] && echo 'dry run' || echo 'delete') |"
            echo "| Max age | ${MAX_AGE_DAYS} days |"
            echo "| Refs examined | $total |"
            echo "| Kept | $kept |"
            echo "| Deleted | $deleted |"
            echo "| Failed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" -eq 0 ]
