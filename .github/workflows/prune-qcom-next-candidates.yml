---
# Prunes the candidate refs created by qcom-next-pr-ci.yml.
#
# Each config PR run pushes a branch named
#
#     qcom-next-candidate/pr-<number>-<short-sha>
#
# to the candidate kernel repository. Those refs are build inputs, and left
# alone they accumulate indefinitely in a kernel-sized repository.
#
# Retention policy, and why it is not simply "delete when the PR closes":
# publication happens *after* the integrator merges the config PR, and it
# publishes the exact candidate commit that passed the gates. Merging the PR
# closes it, so deleting on close would remove the tested tree at the moment it
# is needed, and would leave nothing to republish if publication had to be
# retried.
#
# A ref is therefore kept while any of these hold:
#
#   * its PR is still open                       (publication has not happened)
#   * its PR closed less than --min-closed-age-hours ago
#                                                (publication window / retries)
#   * it is the commit currently published as qcom-next
#                                                (this is the live tree)
#
# Otherwise it is deleted once older than --max-age-days.
name: Prune qcom-next candidate refs

on:
  schedule:
    # 02:40 UTC daily, deliberately away from the nightly build window.
    - cron: '40 2 * * *'
  workflow_dispatch:
    inputs:
      candidate_repo:
        description: Repository holding the candidate refs
        type: string
        default: qualcomm-linux-stg/kernel
        required: false
      published_repo:
        description: Repository holding the published qcom-next branch
        type: string
        default: qualcomm-linux/kernel
        required: false
      published_ref:
        description: Published branch that must never be pruned
        type: string
        default: qcom-next
        required: false
      max_age_days:
        description: Delete refs older than this many days
        type: string
        default: '7'
        required: false
      min_closed_age_hours:
        description: Grace period after a PR closes, to let publication run or be retried
        type: string
        default: '48'
        required: false
      dry_run:
        description: Report what would be deleted without deleting it
        type: boolean
        default: true
        required: false

permissions:
  contents: read

concurrency:
  group: qcom-next-candidate-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune stale candidate refs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SPAT || github.token }}
    steps:
      - name: Prune
        # Dispatch inputs are read here, in a step env, and defaulted in shell.
        # The inputs context does not exist for a schedule event, and job-level
        # env is evaluated during workflow setup, so reading inputs there would
        # make the nightly run fail to start with no usable error.
        env:
          IN_CANDIDATE_REPO: ${{ inputs.candidate_repo }}
          IN_PUBLISHED_REPO: ${{ inputs.published_repo }}
          IN_PUBLISHED_REF: ${{ inputs.published_ref }}
          IN_MAX_AGE_DAYS: ${{ inputs.max_age_days }}
          IN_MIN_CLOSED_AGE_HOURS: ${{ inputs.min_closed_age_hours }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          CANDIDATE_REPO="${IN_CANDIDATE_REPO:-}"
          [ -n "$CANDIDATE_REPO" ] || CANDIDATE_REPO="qualcomm-linux-stg/kernel"
          PUBLISHED_REPO="${IN_PUBLISHED_REPO:-}"
          [ -n "$PUBLISHED_REPO" ] || PUBLISHED_REPO="qualcomm-linux/kernel"
          PUBLISHED_REF="${IN_PUBLISHED_REF:-}"
          [ -n "$PUBLISHED_REF" ] || PUBLISHED_REF="qcom-next"
          MAX_AGE_DAYS="${IN_MAX_AGE_DAYS:-}"
          [ -n "$MAX_AGE_DAYS" ] || MAX_AGE_DAYS=7
          MIN_CLOSED_AGE_HOURS="${IN_MIN_CLOSED_AGE_HOURS:-}"
          [ -n "$MIN_CLOSED_AGE_HOURS" ] || MIN_CLOSED_AGE_HOURS=48

          # A scheduled run deletes; a manual run defaults to a dry run so an
          # operator cannot remove a batch of refs by accident.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRY_RUN="${IN_DRY_RUN:-true}"
            [ -n "$DRY_RUN" ] || DRY_RUN=true
          else
            DRY_RUN=false
          fi

          echo "candidate repo    : $CANDIDATE_REPO"
          echo "published         : $PUBLISHED_REPO @ $PUBLISHED_REF"
          echo "max age (days)    : $MAX_AGE_DAYS"
          echo "closed grace (h)  : $MIN_CLOSED_AGE_HOURS"
          echo "dry run           : $DRY_RUN"
          echo ""

          now_epoch=$(date -u +%s)
          cutoff_epoch=$(( now_epoch - MAX_AGE_DAYS * 86400 ))
          closed_cutoff=$(( now_epoch - MIN_CLOSED_AGE_HOURS * 3600 ))

          # The live qcom-next commit must never be pruned: it is the tree that
          # is currently published, and the only thing a rollback could restore.
          published_sha=$(gh api \
              "repos/${PUBLISHED_REPO}/git/ref/heads/${PUBLISHED_REF}" \
              --jq '.object.sha' 2>/dev/null || echo "")
          if [ -n "$published_sha" ]; then
            echo "published qcom-next sha: $published_sha"
          else
            echo "warning: could not resolve ${PUBLISHED_REPO}@${PUBLISHED_REF};" \
                 "the published-tree guard is inactive for this run"
          fi
          echo ""

          # Paginate; a busy period can leave well over 100 candidate refs.
          refs=$(gh api --paginate \
                   "repos/${CANDIDATE_REPO}/git/matching-refs/heads/qcom-next-candidate/" \
                   --jq '.[].ref' 2>/dev/null || true)

          if [ -z "$refs" ]; then
            echo "no candidate refs found"
            exit 0
          fi

          total=0; kept=0; deleted=0; failed=0

          while read -r ref; do
            [ -n "$ref" ] || continue
            total=$((total + 1))
            branch="${ref#refs/heads/}"

            # qcom-next-candidate/pr-<number>-<short-sha>
            pr_number=$(printf '%s' "$branch" \
                        | sed -n 's#^qcom-next-candidate/pr-\([0-9]\{1,\}\)-.*#\1#p')

            sha=$(gh api "repos/${CANDIDATE_REPO}/git/${ref}" --jq '.object.sha' 2>/dev/null || echo "")

            # Guard 1: never prune the tree that is currently published.
            if [ -n "$sha" ] && [ -n "$published_sha" ] && [ "$sha" = "$published_sha" ]; then
              echo "keep   $branch - currently published as $PUBLISHED_REF"
              kept=$((kept + 1))
              continue
            fi

            commit_date=""
            if [ -n "$sha" ]; then
              commit_date=$(gh api "repos/${CANDIDATE_REPO}/commits/${sha}" \
                              --jq '.commit.committer.date' 2>/dev/null || echo "")
            fi

            age_epoch=0
            if [ -n "$commit_date" ]; then
              age_epoch=$(date -u -d "$commit_date" +%s 2>/dev/null || echo 0)
            fi
            too_old=0
            if [ "$age_epoch" -gt 0 ] && [ "$age_epoch" -lt "$cutoff_epoch" ]; then
              too_old=1
            fi

            reason=""
            if [ -n "$pr_number" ]; then
              pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
                          --jq '{state: .state, closed_at: .closed_at}' 2>/dev/null || echo '{}')
              state=$(printf '%s' "$pr_json" | jq -r '.state // "unknown"')
              closed_at=$(printf '%s' "$pr_json" | jq -r '.closed_at // ""')

              case "$state" in
                closed)
                  closed_epoch=0
                  if [ -n "$closed_at" ] && [ "$closed_at" != "null" ]; then
                    closed_epoch=$(date -u -d "$closed_at" +%s 2>/dev/null || echo 0)
                  fi
                  # Guard 2: leave a window after the merge so publication can
                  # run, and be retried, against the tested candidate.
                  if [ "$closed_epoch" -gt 0 ] && [ "$closed_epoch" -ge "$closed_cutoff" ]; then
                    echo "keep   $branch - PR #${pr_number} closed less than ${MIN_CLOSED_AGE_HOURS}h ago (publication window)"
                    kept=$((kept + 1))
                    continue
                  fi
                  reason="PR #${pr_number} closed over ${MIN_CLOSED_AGE_HOURS}h ago"
                  ;;
                open)
                  [ "$too_old" -eq 1 ] && reason="older than ${MAX_AGE_DAYS}d (PR #${pr_number} still open)"
                  ;;
                *)
                  # Unknown PR state: fall back to age alone rather than
                  # deleting something that might still be in use.
                  [ "$too_old" -eq 1 ] && reason="older than ${MAX_AGE_DAYS}d (PR #${pr_number} state unknown)"
                  ;;
              esac
            else
              [ "$too_old" -eq 1 ] && reason="older than ${MAX_AGE_DAYS}d (no PR number in the ref name)"
            fi

            if [ -z "$reason" ]; then
              echo "keep   $branch"
              kept=$((kept + 1))
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "would delete $branch - $reason"
              deleted=$((deleted + 1))
              continue
            fi

            if gh api -X DELETE "repos/${CANDIDATE_REPO}/git/${ref}" >/dev/null 2>&1; then
              echo "delete $branch - $reason"
              deleted=$((deleted + 1))
            else
              echo "FAILED to delete $branch"
              failed=$((failed + 1))
            fi
          done <<< "$refs"

          echo ""
          echo "total=$total kept=$kept deleted=$deleted failed=$failed"

          {
            echo "## qcom-next candidate ref prune"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Candidate repository | \`$CANDIDATE_REPO\` |"
            echo "| Published tree | \`$PUBLISHED_REPO\` @ \`$PUBLISHED_REF\` |"
            echo "| Mode | $([ "$DRY_RUN" = "true" ] && echo 'dry run' || echo 'delete') |"
            echo "| Max age | ${MAX_AGE_DAYS} days |"
            echo "| Grace after PR close | ${MIN_CLOSED_AGE_HOURS} hours |"
            echo "| Refs examined | $total |"
            echo "| Kept | $kept |"
            echo "| Deleted | $deleted |"
            echo "| Failed | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$failed" -eq 0 ]
