---
# Phase 3 of the kernel topic promotion flow.
#
# End-to-end CI for a change to the SHA-pinned qcom-next configuration:
#
#   validate + classify  ->  generate candidate tree  ->  push candidate ref
#   ->  run the kernel/Yocto/Ubuntu gates against it  ->  report on the PR
#
# The object under test is a generated candidate ref, not a pull request head.
# qcom-next itself is never written here; publication is Phase 5.
#
# Candidate refs are pushed to a staging kernel repository
# (qualcomm-linux-stg/kernel by default) so the flow can be exercised without
# touching production refs.
#
# How to trigger this
# -------------------
# Pull request (works straight away): open a PR that touches qcom-next.yaml or
# scripts/**. The pull_request event runs this workflow from the PR branch, so
# it does not need to exist on the default branch first.
#
# Actions UI / workflow_dispatch: GitHub only shows a "Run workflow" button for
# a workflow that exists on the **default branch**, and the dispatch API can
# only find it there. Until this file is merged to the default branch, use the
# pull request route. Once merged, the UI lets you pick which branch to run
# from, and that branch's copy of this file is the one that executes.
#
# Prerequisites that live outside this file:
#
#   * SPAT must be able to push branches to the candidate repository and post
#     commit statuses on it.
#   * The dispatched gates run their workflow file from the ref given to
#     gh workflow run, so they follow this branch. The composite actions they
#     call internally are still resolved at @main inside build.yml and
#     test.yml; fully un-pinning those needs build.yml restructured to keep
#     kernel-config in a subdirectory, because the sync action replaces the
#     workspace with the kernel tree. Gates therefore default to "none".
name: qcom-next config PR CI

on:
  pull_request:
    branches: [main, ci-v2]
    # This is the single entry point for pull requests, so the paths here must
    # cover everything that affects the pinned config or the CI that consumes
    # it, including the files the validate workflow used to watch itself.
    paths:
      - qcom-next.yaml
      - schemas/qcom-next.schema.json
      - scripts/**
      - topic_maintainers.json
      - .github/actions/sync/action.yml
      - .github/workflows/qcom-next-pr-ci.yml
      - .github/workflows/validate-qcom-next-config.yml
      - .github/workflows/prune-qcom-next-candidates.yml
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to report against (0 for a manual run)
        type: string
        default: '0'
        required: false
      candidate_repo:
        description: Repository to push the candidate ref to
        type: string
        default: qualcomm-linux-stg/kernel
        required: false
      gates:
        description: "Gates to run: all, pre-merge, yocto, ubuntu, none"
        type: string
        default: none
        required: false
      allow_untagged:
        description: Downgrade missing-tag errors to warnings (migration only)
        type: boolean
        default: true
        required: false
      keep_candidate:
        description: Keep the candidate ref even if the run fails
        type: boolean
        default: false
        required: false

# Least privilege at the workflow level: only the reporting job needs to write
# to the PR, so it requests that itself.
permissions:
  contents: read

concurrency:
  group: qcom-next-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Only static values here. The inputs context does not exist for a
  # pull_request event, and workflow-level env is evaluated during workflow
  # setup, so referencing inputs here makes the whole workflow fail to start
  # with no usable error. Dispatch inputs are resolved in the config job below,
  # where step-level expressions are evaluated at run time instead.
  TOPICS_REPO: qualcomm-linux/kernel-topics
  AUTOMERGE_REPO: qualcomm-linux/automerge
  INTEG_BRANCH: qcom-next

jobs:
  # ------------------------------------------------------------------ config
  config:
    # Resolves every dispatch input to a concrete value exactly once, so no
    # other job or expression has to touch the inputs context. Defaults apply
    # on a pull_request run, where no inputs are supplied.
    name: Resolve settings
    runs-on: ubuntu-latest
    outputs:
      candidate_repo: ${{ steps.r.outputs.candidate_repo }}
      gates: ${{ steps.r.outputs.gates }}
      allow_untagged: ${{ steps.r.outputs.allow_untagged }}
      pr_number: ${{ steps.r.outputs.pr_number }}
    steps:
      - name: Resolve
        id: r
        env:
          IN_CANDIDATE_REPO: ${{ inputs.candidate_repo }}
          IN_GATES: ${{ inputs.gates }}
          IN_ALLOW_UNTAGGED: ${{ inputs.allow_untagged }}
          IN_PR: ${{ inputs.pr }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          candidate_repo="${IN_CANDIDATE_REPO:-}"
          [ -n "$candidate_repo" ] || candidate_repo="qualcomm-linux-stg/kernel"

          # Gates default to off, including for pull_request runs. The gates
          # resolve their composite actions at @main, so they cannot yet test a
          # candidate in a staging repo; opt in explicitly once that is fixed.
          gates="${IN_GATES:-}"
          [ -n "$gates" ] || gates="none"

          # Untagged SHAs are tolerated for the duration of the migration: most
          # topics have no conventional tag yet. This concerns tags only; an
          # unpinned sha is still rejected by the schema and by V5.
          allow_untagged="${IN_ALLOW_UNTAGGED:-}"
          [ -n "$allow_untagged" ] || allow_untagged="true"

          pr_number="${EVENT_PR:-}"
          [ -n "$pr_number" ] || pr_number="${IN_PR:-0}"
          [ -n "$pr_number" ] || pr_number="0"

          {
            echo "candidate_repo=$candidate_repo"
            echo "gates=$gates"
            echo "allow_untagged=$allow_untagged"
            echo "pr_number=$pr_number"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## qcom-next PR CI settings"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Candidate repository | \`$candidate_repo\` |"
            echo "| Gates | \`$gates\` |"
            echo "| Allow untagged SHAs | \`$allow_untagged\` |"
            echo "| PR number | \`$pr_number\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- validate
  validate:
    name: Validate and classify
    needs: config
    uses: ./.github/workflows/validate-qcom-next-config.yml
    # A called workflow cannot request more than its caller grants, and the
    # workflow-level block above deliberately grants only contents: read, which
    # implicitly makes every other scope none. The called workflow's validate
    # job asks for pull-requests: write so it can comment, so that ceiling has
    # to be raised here. Doing it on this job rather than workflow-wide keeps
    # the rest of the jobs least-privileged.
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
    with:
      allow_untagged: ${{ needs.config.outputs.allow_untagged == 'true' }}

  # ------------------------------------------------------- generate + push
  candidate:
    name: Generate and push candidate
    needs: [config, validate]
    # metadata-only and no-change leave the generated tree identical, so there
    # is nothing to build and nothing to test.
    if: >-
      needs.validate.outputs.classification != 'metadata-only' &&
      needs.validate.outputs.classification != 'no-change' &&
      needs.validate.outputs.classification != 'invalid-mixed-change'
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [self-hosted, kernel-prd-u2404-x64-large-od-ephem]
    env:
      CANDIDATE_REPO: ${{ needs.config.outputs.candidate_repo }}
    outputs:
      candidate_ref: ${{ steps.push.outputs.candidate_ref }}
      candidate_sha: ${{ steps.push.outputs.candidate_sha }}
      digest: ${{ steps.generate.outputs.digest }}
      topics_merged: ${{ steps.generate.outputs.topics_merged }}
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4
        with:
          path: kernel-config
          fetch-depth: 0

      - name: Checkout automerge
        uses: actions/checkout@v4
        with:
          repository: ${{ env.AUTOMERGE_REPO }}
          path: automerge
          token: ${{ secrets.SPAT || github.token }}

      - name: Checkout kernel-topics
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TOPICS_REPO }}
          path: kernel-topics
          # Full history and tags: pinned SHAs are frequently behind the branch
          # tip, and a pin is only reachable through its tag once the topic has
          # been rebased.
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.SPAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pyyaml jsonschema

      - name: Generate the candidate tree
        id: generate
        working-directory: kernel-config
        run: |
          set -euo pipefail
          bash scripts/generate_qcom_next_tree.sh \
              --config qcom-next.yaml \
              --kernel-dir "$GITHUB_WORKSPACE/kernel-topics" \
              --automerge "$GITHUB_WORKSPACE/automerge" \
              --integ-branch "${INTEG_BRANCH}" \
              --out-dir "$GITHUB_WORKSPACE/candidate" \
              --verbose

          out="$GITHUB_WORKSPACE/candidate"
          digest=$(awk -F'\t' '$1=="digest" {print $2; exit}' "$out/tested-set.txt")
          merged=$(awk -F'\t' '$4=="merged"' "$out/topic-shas.tsv" | grep -c . || true)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "topics_merged=${merged:-0}" >> "$GITHUB_OUTPUT"
          echo "Tested-set digest: $digest"

      - name: Push the candidate ref
        id: push
        env:
          GH_PUSH_TOKEN: ${{ secrets.SPAT }}
          PR_NUMBER: ${{ needs.config.outputs.pr_number }}
        run: |
          set -euo pipefail

          if [ -z "${GH_PUSH_TOKEN:-}" ]; then
            echo "::error title=qcom-next candidate::no push token available. SPAT must have push access to ${CANDIDATE_REPO}."
            exit 1
          fi

          pr_number="${PR_NUMBER:-0}"
          cd "$GITHUB_WORKSPACE/kernel-topics"
          candidate_sha=$(git rev-parse "refs/heads/${INTEG_BRANCH}")
          short=${candidate_sha:0:12}

          # One ref per tested commit. This does not dedupe re-runs: generation
          # is content-reproducible, but ci-merge stamps its merge commits with
          # the current time, so identical inputs still yield a new commit id
          # and therefore a new ref. Keying on the content digest instead would
          # collapse them, at the cost of force-moving the ref and potentially
          # orphaning the exact commit the gates tested before publication can
          # push it. Accumulation is handled by prune-qcom-next-candidates.yml.
          candidate_ref="qcom-next-candidate/pr-${pr_number}-${short}"

          git remote remove candidate 2>/dev/null || true
          git remote add candidate \
              "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${CANDIDATE_REPO}.git"

          echo "pushing ${INTEG_BRANCH} -> ${CANDIDATE_REPO}:${candidate_ref}"
          git push --force candidate \
              "refs/heads/${INTEG_BRANCH}:refs/heads/${candidate_ref}"

          git remote remove candidate

          echo "candidate_ref=$candidate_ref" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Candidate: ${CANDIDATE_REPO} @ ${candidate_ref} (${candidate_sha})"

      - name: Upload candidate artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qcom-next-candidate
          path: |
            candidate/merge.conf
            candidate/merge.log
            candidate/tested-set.txt
            candidate/topic-shas.tsv
            candidate/conflicts.txt
            candidate/summary.md
          if-no-files-found: warn
          retention-days: 14

      - name: Job summary
        if: ${{ always() }}
        env:
          CANDIDATE_REF: ${{ steps.push.outputs.candidate_ref }}
          CANDIDATE_SHA: ${{ steps.push.outputs.candidate_sha }}
          CLASSIFICATION: ${{ needs.validate.outputs.classification }}
        run: |
          {
            if [ -f candidate/summary.md ]; then
              cat candidate/summary.md
            else
              echo "### qcom-next candidate tree"
              echo ""
              echo "Generation did not produce a summary; see the job log."
            fi
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Candidate repo | \`${CANDIDATE_REPO}\` |"
            echo "| Candidate ref | \`${CANDIDATE_REF:-not pushed}\` |"
            echo "| Candidate sha | \`${CANDIDATE_SHA:-n/a}\` |"
            echo "| Classification | \`${CLASSIFICATION:-n/a}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ gates
  gates:
    name: Run gates on the candidate
    needs: [config, validate, candidate]
    # Gates default to "none", resolved in the config job. That is deliberate
    # for the migration: the gates resolve their composite actions at @main
    # (see the header), so they cannot yet test a candidate in a staging repo.
    # Opt in explicitly with -f gates=pre-merge|all once that is resolved.
    if: >-
      needs.candidate.result == 'success' &&
      needs.config.outputs.gates != 'none'
    runs-on: ubuntu-latest
    env:
      CANDIDATE_REPO: ${{ needs.config.outputs.candidate_repo }}
    outputs:
      result: ${{ steps.gates.outcome }}
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4

      - name: Resolve the gate list
        id: list
        env:
          REQUESTED: ${{ needs.config.outputs.gates }}
          CLASSIFICATION: ${{ needs.validate.outputs.classification }}
          REQUIRED_GATES: ${{ needs.validate.outputs.required_gates }}
        run: |
          set -euo pipefail
          case "$REQUESTED" in
            all)  gates="pre-merge,yocto,ubuntu" ;;
            none) gates="" ;;
            *)    gates="$REQUESTED" ;;
          esac
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "classification=$CLASSIFICATION requires: ${REQUIRED_GATES:-unknown}"
          echo "running gates: ${gates:-<none>}"

      - name: Dispatch gates and wait
        id: gates
        if: ${{ steps.list.outputs.gates != '' }}
        env:
          GH_TOKEN: ${{ secrets.SPAT || github.token }}
          # Run the gate workflow files from the branch under test rather than
          # the repository default.
          GATE_WORKFLOW_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_REF: ${{ needs.candidate.outputs.candidate_ref }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          GATE_LIST: ${{ steps.list.outputs.gates }}
          PR_NUMBER: ${{ needs.config.outputs.pr_number }}
          WORKFLOW_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/dispatch_gates.sh \
              --candidate-repo "${CANDIDATE_REPO}" \
              --candidate-ref "${CANDIDATE_REF}" \
              --candidate-sha "${CANDIDATE_SHA}" \
              --workflow-repo "${WORKFLOW_REPO}" \
              --workflow-ref "${GATE_WORKFLOW_REF}" \
              --gates "${GATE_LIST}" \
              --pr "${PR_NUMBER}" \
              --output "$GITHUB_WORKSPACE/gate-summary.md" \
              --verbose

      - name: Upload gate summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qcom-next-gate-results
          path: gate-summary.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            if [ -f gate-summary.md ]; then
              cat gate-summary.md
            else
              echo "### Candidate gate results"
              echo ""
              echo "No gate summary was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- report
  report:
    name: Report on the PR
    needs: [config, validate, candidate, gates]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      CANDIDATE_REPO: ${{ needs.config.outputs.candidate_repo }}
    # Scoped here rather than workflow-wide: this is the only job that writes
    # to the PR. A fork PR gets read-only regardless, which the step handles.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download candidate artifacts
        uses: actions/download-artifact@v4
        with:
          name: qcom-next-candidate
          path: candidate
        continue-on-error: true

      - name: Download gate results
        uses: actions/download-artifact@v4
        with:
          name: qcom-next-gate-results
          path: gates
        continue-on-error: true

      - name: Post or update the PR comment
        # A fork PR always gets a read-only GITHUB_TOKEN, so commenting is
        # impossible and returns 403. Skip rather than fail; the job summaries
        # carry the same content. continue-on-error covers anything else.
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CLASSIFICATION: ${{ needs.validate.outputs.classification }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          CANDIDATE_REF: ${{ needs.candidate.outputs.candidate_ref }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.candidate_sha }}
          DIGEST: ${{ needs.candidate.outputs.digest }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- qcom-next-pr-ci -->';
            const read = (p) => { try { return fs.readFileSync(p, 'utf8'); } catch { return ''; } };

            // Values arrive through env rather than being interpolated into
            // this script body, so no workflow value can be parsed as code.
            // CANDIDATE_REPO comes from this job's env, resolved by the
            // config job.
            const classification  = process.env.CLASSIFICATION || 'n/a';
            const candidateResult = process.env.CANDIDATE_RESULT || 'unknown';
            const gatesResult     = process.env.GATES_RESULT || 'unknown';
            const candidateRef    = process.env.CANDIDATE_REF || '';
            const candidateSha    = process.env.CANDIDATE_SHA || '';
            const candidateRepo   = process.env.CANDIDATE_REPO || '';
            const digest          = process.env.DIGEST || '';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
                           `/actions/runs/${process.env.GITHUB_RUN_ID}`;

            const skipped = ['metadata-only', 'no-change'].includes(classification);
            const ok = skipped
              ? true
              : candidateResult === 'success' &&
                ['success', 'skipped'].includes(gatesResult);

            const lines = [
              marker,
              `## qcom-next config PR CI: ${ok ? 'passed' : 'needs attention'}`,
              '',
              `- Classification: \`${classification}\``,
              `- Candidate generation: \`${candidateResult}\``,
              `- Gates: \`${gatesResult}\``,
            ];

            if (candidateRef) {
              const refUrl = `https://github.com/${candidateRepo}/tree/${candidateRef}`;
              lines.push(`- Candidate ref: [\`${candidateRef}\`](${refUrl}) in \`${candidateRepo}\``);
              lines.push(`- Candidate commit: \`${candidateSha}\``);
            }
            if (digest) {
              lines.push(`- Tested-set digest: \`${digest}\``);
            }
            if (skipped) {
              lines.push('');
              lines.push('The generated tree is unchanged by this PR, so the build and test ' +
                         'gates were not run.');
            }
            lines.push(`- [Full run](${runUrl})`);
            lines.push('');
            lines.push(read('candidate/summary.md'));
            lines.push('');
            lines.push(read('gates/gate-summary.md'));

            const body = lines.join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = existing.find((c) => c.body && c.body.includes(marker));

            if (mine) {
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

      - name: Summarise instead of commenting
        if: >-
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          CLASSIFICATION: ${{ needs.validate.outputs.classification }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          CANDIDATE_REF: ${{ needs.candidate.outputs.candidate_ref }}
        run: |
          echo "::notice title=qcom-next PR CI::PR is from a fork, so GITHUB_TOKEN is read-only and no comment was posted."
          {
            echo "## qcom-next config PR CI"
            echo ""
            echo "PR is from a fork, so no comment could be posted."
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Classification | \`${CLASSIFICATION:-n/a}\` |"
            echo "| Candidate generation | \`${CANDIDATE_RESULT:-n/a}\` |"
            echo "| Gates | \`${GATES_RESULT:-n/a}\` |"
            echo "| Candidate ref | \`${CANDIDATE_REF:-not pushed}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------ final status
  final-status:
    name: Final status
    needs: [validate, candidate, gates]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Decide the overall verdict
        env:
          CLASSIFICATION: ${{ needs.validate.outputs.classification }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          GATES_RESULT: ${{ needs.gates.result }}
        run: |
          set -euo pipefail
          classification="${CLASSIFICATION:-}"
          validate="${VALIDATE_RESULT:-}"
          candidate="${CANDIDATE_RESULT:-}"
          gates="${GATES_RESULT:-}"

          echo "classification : $classification"
          echo "validate       : $validate"
          echo "candidate      : $candidate"
          echo "gates          : $gates"

          if [ "$validate" != "success" ]; then
            echo "::error title=qcom-next PR CI::configuration validation failed"
            exit 1
          fi

          case "$classification" in
            metadata-only|no-change)
              echo "generated tree is unchanged; gates intentionally skipped"
              exit 0
              ;;
            invalid-mixed-change)
              echo "::error title=qcom-next PR CI::change rejected by the classifier"
              exit 1
              ;;
          esac

          if [ "$candidate" != "success" ]; then
            echo "::error title=qcom-next PR CI::candidate tree generation failed"
            exit 1
          fi
          case "$gates" in
            success|skipped) ;;
            *)
              echo "::error title=qcom-next PR CI::candidate gates did not pass"
              exit 1
              ;;
          esac
          echo "all required stages passed"
