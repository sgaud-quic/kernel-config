---
# Phase 5 of the kernel topic promotion flow: publication.
#
# Publishes the tested candidate tree as qcom-next after the integrator merges
# the config PR. This workflow performs a real publication; the target defaults
# to the staging kernel repository so the flow is proven end to end before it is
# pointed at production.
#
# Ordering (decisions 11 and 12): the integrator merges the config PR, and this
# runs afterwards on the push to the default branch. A failure here therefore
# leaves the config branch ahead of qcom-next, which is a benign "needs
# republish" state that a re-run resolves -- rather than a published tree that
# no merged config describes.
#
# It never regenerates the tree. ci-merge stamps merge commits with the current
# time, so regenerating from the merged config would produce a content-identical
# commit with a different id. The commit that passed the gates is the commit
# that becomes qcom-next, looked up by the merged config's digest from
#
#     refs/qcom-next-tested/<digest>
#
# in the candidate repository, written by qcom-next-pr-ci.yml.
#
# Switching to production: set publish_repo to qualcomm-linux/kernel. Keep it on
# staging until a staging publication has been observed to work.
name: Publish qcom-next

on:
  push:
    # The default branch only. A push to a development branch must never
    # publish: once publish_repo points at production, a push to ci-v2 that
    # happened to touch qcom-next.yaml would publish production from a branch
    # nobody merged. Development runs use workflow_dispatch with an explicit
    # --ref instead, which is how every run so far was driven anyway.
    branches: [main]
    paths:
      - qcom-next.yaml
  workflow_dispatch:
    inputs:
      candidate_repo:
        description: Repository holding the candidates and their manifests
        type: string
        default: qualcomm-linux-stg/kernel
        required: false
      publish_repo:
        description: Repository whose branch is updated
        type: string
        default: qualcomm-linux-stg/kernel
        required: false
      publish_ref:
        description: Branch to update
        type: string
        default: qcom-next
        required: false
      require_statuses:
        description: Comma-separated checks that must be green on the candidate
        type: string
        default: qcom-next-build
        required: false
      digest:
        description: Publish this digest instead of the merged config's
        type: string
        default: ''
        required: false
      dry_run:
        description: Verify everything without pushing
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  # Never cancel a publication in flight, and never run two at once: both would
  # race on the same branch.
  group: qcom-next-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the tested candidate
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
      published_sha: ${{ steps.publish.outputs.published_sha }}
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade pyyaml jsonschema

      - name: Resolve settings
        id: r
        env:
          IN_CANDIDATE_REPO: ${{ inputs.candidate_repo }}
          IN_PUBLISH_REPO: ${{ inputs.publish_repo }}
          IN_PUBLISH_REF: ${{ inputs.publish_ref }}
          IN_REQUIRE_STATUSES: ${{ inputs.require_statuses }}
          IN_DIGEST: ${{ inputs.digest }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # A push event supplies no inputs, so every value needs a default
          # here rather than in the on: block.
          candidate_repo="${IN_CANDIDATE_REPO:-}"
          [ -n "$candidate_repo" ] || candidate_repo="qualcomm-linux-stg/kernel"

          publish_repo="${IN_PUBLISH_REPO:-}"
          [ -n "$publish_repo" ] || publish_repo="qualcomm-linux-stg/kernel"

          publish_ref="${IN_PUBLISH_REF:-}"
          [ -n "$publish_ref" ] || publish_ref="qcom-next"

          # Deliberately defaulted rather than left empty: an empty value means
          # "require nothing", which would publish an unproven commit.
          require_statuses="${IN_REQUIRE_STATUSES-}"
          if [ -z "${IN_REQUIRE_STATUSES+x}" ] || [ -z "$require_statuses" ]; then
            require_statuses="qcom-next-build"
          fi

          dry_run="${IN_DRY_RUN:-}"
          [ -n "$dry_run" ] || dry_run="false"

          {
            echo "candidate_repo=$candidate_repo"
            echo "publish_repo=$publish_repo"
            echo "publish_ref=$publish_ref"
            echo "require_statuses=$require_statuses"
            echo "digest=${IN_DIGEST:-}"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## qcom-next publication settings"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Candidate repository | \`$candidate_repo\` |"
            echo "| Publish target | \`$publish_repo\` @ \`$publish_ref\` |"
            echo "| Required checks | \`$require_statuses\` |"
            echo "| Dry run | \`$dry_run\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse to publish a non-staging target from a side branch
        env:
          PUBLISH_REPO: ${{ steps.r.outputs.publish_repo }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # The config that decides what gets published is read from the ref
          # this run was started on. Publishing anything other than the staging
          # target therefore has to come from the default branch, or the
          # published tree would be described by a config nobody merged.
          # Restricting the push trigger is not enough on its own, because a
          # workflow_dispatch can name any ref.
          staging="qualcomm-linux-stg/kernel"
          default_branch="${DEFAULT_BRANCH:-main}"

          if [ "${PUBLISH_REPO}" = "$staging" ]; then
            echo "target is the staging repo; any ref may drive it"
            exit 0
          fi

          if [ "${GITHUB_REF_NAME}" != "$default_branch" ]; then
            echo "::error title=qcom-next publication::refusing to publish to ${PUBLISH_REPO} from '${GITHUB_REF_NAME}'. Only '${default_branch}' may publish a non-staging target, because the config is read from the running ref. Merge the config first, then publish from ${default_branch}."
            exit 1
          fi
          echo "publishing ${PUBLISH_REPO} from the default branch '${default_branch}'"

      - name: Publish
        id: publish
        env:
          GH_PUSH_TOKEN: ${{ secrets.SPAT }}
          GH_TOKEN: ${{ secrets.SPAT || github.token }}
          CANDIDATE_REPO: ${{ steps.r.outputs.candidate_repo }}
          PUBLISH_REPO: ${{ steps.r.outputs.publish_repo }}
          PUBLISH_REF: ${{ steps.r.outputs.publish_ref }}
          REQUIRE_STATUSES: ${{ steps.r.outputs.require_statuses }}
          DIGEST: ${{ steps.r.outputs.digest }}
          DRY_RUN: ${{ steps.r.outputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${GH_PUSH_TOKEN:-}" ]; then
            echo "::error title=qcom-next publication::no push token available. SPAT must have push access to ${PUBLISH_REPO}."
            exit 1
          fi

          args=(
            --config qcom-next.yaml
            --candidate-repo "${CANDIDATE_REPO}"
            --publish-repo "${PUBLISH_REPO}"
            --publish-ref "${PUBLISH_REF}"
            --require-statuses "${REQUIRE_STATUSES}"
            --output "$GITHUB_WORKSPACE/publication.md"
          )
          [ -n "${DIGEST}" ] && args+=(--digest "${DIGEST}")
          [ "${DRY_RUN}" = "true" ] && args+=(--dry-run)

          rc=0
          bash scripts/publish_qcom_next.sh "${args[@]}" 2>&1 | tee publish.log || rc=$?

          outcome="$(awk '/^RESULT: /{print; exit}' publish.log || true)"
          echo "outcome=${outcome:-unknown}" >> "$GITHUB_OUTPUT"
          sha="$(awk -F'[ |`]+' '/\| Published commit \|/{print $4; exit}' \
                 "$GITHUB_WORKSPACE/publication.md" 2>/dev/null || true)"
          echo "published_sha=${sha:-}" >> "$GITHUB_OUTPUT"

          exit "$rc"

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            if [ -f publication.md ]; then
              cat publication.md
            else
              echo "### qcom-next publication"
              echo ""
              echo "Publication did not produce a summary; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publication record
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qcom-next-publication
          path: |
            publication.md
            publish.log
          if-no-files-found: warn
          retention-days: 90

      - name: Explain a failed publication
        if: ${{ failure() }}
        env:
          PUBLISH_REPO: ${{ steps.r.outputs.publish_repo }}
          PUBLISH_REF: ${{ steps.r.outputs.publish_ref }}
        run: |
          echo "::error title=qcom-next publication::${PUBLISH_REF} was not updated. The merged config is ahead of ${PUBLISH_REPO}:${PUBLISH_REF}; re-run this workflow once the cause is fixed. Nothing was partially published."
