---
# Candidate gate for the SHA-pinned qcom-next flow.
#
# The existing gates (pre_merge.yml and friends) are built around a pull
# request in qualcomm-linux/kernel: sync@main switches on inputs.repo matching
# one of two hardcoded names and no-ops for anything else, pre_merge.yml runs
# its test job only when inputs.repo == 'qualcomm-linux/kernel', and
# comment.yml expects inputs.pr to be a PR in the repo being built. A candidate
# is none of those things. It is an already-merged tree on a branch in a
# staging repo, proposed by a PR in *this* repo, so forcing it through that
# path silently skips the parts that matter.
#
# This workflow therefore builds a plain branch ref in an arbitrary repo and
# reports through a commit status on the candidate commit, which is what
# scripts/dispatch_gates.sh polls.
#
# Note the checkout order below: kernel-config is checked out at the workspace
# root first so that local composite actions resolve, and the candidate goes
# into a subdirectory afterwards. actions/checkout only cleans its own target
# path, so this avoids the workspace-wiping behaviour that made build.yml
# unusable here.
name: qcom-next candidate gates

run-name: "qcom-next build gate: ${{ inputs.repo }}@${{ inputs.ref }}"

on:
  # Called by qcom-next-pr-ci.yml. A local reusable-workflow reference resolves
  # from the calling commit, so this path works on a feature branch. That
  # matters: workflow_dispatch only triggers for files already on the default
  # branch, so until this lands on main the dispatch path below cannot be used
  # at all. Being called also gives native waiting, log streaming and
  # cancellation instead of polling a commit status.
  workflow_call:
    inputs:
      pr:
        description: kernel-config PR number that proposed this candidate
        type: string
        required: true
      sha:
        description: Candidate commit to build and to report the status on
        type: string
        required: true
      ref:
        description: Candidate branch ref in the candidate repo
        type: string
        required: true
      repo:
        description: Repository holding the candidate ref (OWNER/REPO)
        type: string
        required: true
      variant:
        description: Kernel variant to build (default or RT)
        type: string
        required: false
        default: default
  # Retained for standalone and batch use once this file reaches the default
  # branch; scripts/dispatch_gates.sh drives that path.
  workflow_dispatch:
    inputs:
      pr:
        description: kernel-config PR number that proposed this candidate
        type: string
        required: true
      sha:
        description: Candidate commit to build and to report the status on
        type: string
        required: true
      ref:
        description: Candidate branch ref in the candidate repo
        type: string
        required: true
      repo:
        description: Repository holding the candidate ref (OWNER/REPO)
        type: string
        required: true
      variant:
        description: Kernel variant to build
        type: choice
        options: [default, RT]
        default: default

# Status posting and the candidate checkout both go through SPAT, since the
# candidate lives in a different repository than this workflow.
permissions:
  contents: read

concurrency:
  group: qcom-next-gates-${{ inputs.repo }}-${{ inputs.sha }}
  cancel-in-progress: false

env:
  CHECK_NAME: qcom-next-build

jobs:
  # Posted from a fast hosted runner rather than from the build job, because
  # the build job can sit in the self-hosted queue for longer than the
  # dispatcher's grace period for the first status to appear.
  start:
    name: Report gate started
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4

      - name: Post pending status
        uses: ./.github/actions/workflow_status
        with:
          sha: ${{ inputs.sha }}
          repo: ${{ inputs.repo }}
          check_name: ${{ env.CHECK_NAME }}
          action_mode: start
          GH_TOKEN: ${{ secrets.SPAT }}

  build:
    name: Build the candidate
    needs: start
    runs-on:
      group: GHA-Kernel-SelfHosted-RG
      labels: [self-hosted, kernel-prd-u2404-x64-large-od-ephem]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
    outputs:
      kernel_version: ${{ steps.build.outputs.kernel_version }}
    steps:
      # Root checkout first: it cleans the workspace, so it has to happen
      # before the candidate is placed in a subdirectory.
      - name: Checkout kernel-config
        uses: actions/checkout@v4

      - name: Checkout the candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.sha }}
          path: kernel
          fetch-depth: 1
          token: ${{ secrets.SPAT || github.token }}

      - name: Confirm the candidate commit
        env:
          WANT_SHA: ${{ inputs.sha }}
          WANT_REF: ${{ inputs.ref }}
          WANT_REPO: ${{ inputs.repo }}
        working-directory: kernel
        run: |
          set -euo pipefail
          got=$(git rev-parse HEAD)
          echo "repo      : ${WANT_REPO}"
          echo "ref       : ${WANT_REF}"
          echo "requested : ${WANT_SHA}"
          echo "checked   : ${got}"
          # A gate result is only meaningful if it refers to the exact commit
          # the dispatcher will record as tested.
          if [ "$got" != "$WANT_SHA" ]; then
            echo "::error title=qcom-next build gate::checked out ${got} but the gate was asked for ${WANT_SHA}"
            exit 1
          fi
          echo "kernel version: $(make kernelversion 2>/dev/null || echo unknown)"

      - name: Pull docker image
        uses: ./.github/actions/pull_docker_image
        with:
          image: ${{ vars.TECH_TEAM_NAMESPACE }}/kmake-image:${{ vars.KMAKE_IMAGE_VERSION }}
          registry: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build the candidate
        id: build
        uses: ./.github/actions/build
        with:
          docker_image: ${{ vars.TECH_TEAM_NAMESPACE }}/kmake-image:${{ vars.KMAKE_IMAGE_VERSION }}
          workspace_path: ${{ github.workspace }}/kernel
          variant: ${{ inputs.variant }}

      - name: Job summary
        if: ${{ always() }}
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          SHA: ${{ inputs.sha }}
          KVER: ${{ steps.build.outputs.kernel_version }}
          RESULT: ${{ steps.build.outcome }}
        run: |
          {
            echo "### qcom-next build gate"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Candidate repo | \`${REPO}\` |"
            echo "| Candidate ref | \`${REF}\` |"
            echo "| Candidate commit | \`${SHA}\` |"
            echo "| Kernel version | \`${KVER:-unknown}\` |"
            echo "| Build | \`${RESULT:-unknown}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate terminal job so the status is reported even when the build job is
  # cancelled or the runner dies, which a step-level always() would miss.
  finish:
    name: Report gate result
    needs: [start, build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel-config
        uses: actions/checkout@v4

      - name: Post final status
        uses: ./.github/actions/workflow_status
        with:
          sha: ${{ inputs.sha }}
          repo: ${{ inputs.repo }}
          check_name: ${{ env.CHECK_NAME }}
          action_mode: ${{ needs.build.result == 'success' && 'success' || 'failure' }}
          GH_TOKEN: ${{ secrets.SPAT }}
