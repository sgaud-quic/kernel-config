name: Sync workspace

inputs:
  base_branch:
    description: Base branch
    required: true
    default: qcom-next-staging
  pr_number:
    description: PR number
    required: false
  GH_TOKEN:
    description: Access Token
    required: true
  repo:
    description: repo
    required: true

outputs:
  workspace_path:
    description: Sync workspace path
    value: ${{ steps.set-workspace.outputs.workspace }}

runs:
  using: "composite"
  steps:
    - name: Clean workspace
      shell: bash
      run: |
        echo "Cleaning up workspace..."
        rm -rf ${{ github.workspace }}/*
        echo "Workspace cleaned successfully!"

    - name: Checkout PR branch
      if: inputs.repo == 'qualcomm-linux/kernel'
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        repository: qualcomm-linux/kernel
        ref: ${{ inputs.base_branch }}

    - name: Configure git
      shell: bash
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"

    - name: Sync with latest changes
      if: inputs.repo == 'qualcomm-linux/kernel'
      shell: bash
      run: |
        set -e
        echo "Syncing with latest changes..."
        git fetch origin ${{ inputs.base_branch }}
        git merge --no-ff origin/${{ inputs.base_branch }}

    - name: Clone repositories
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      run: |
        git clone --branch qcom-next https://github.com/qualcomm-linux/kernel.git kernel

    - name: Cherry-pick kernel-topics PR onto qcom-next
      if: inputs.repo == 'qualcomm-linux/kernel-topics'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.GH_TOKEN }}
      run: |
        set -euo pipefail
        cd kernel

        api_get() {
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$1"
        }

        get_pr_commits() {
          local pr="$1"
          local commits_file="${RUNNER_TEMP}/kernel-topics-pr-${pr}-commits"
          local commits_json count page

          : > "${commits_file}"
          page=1
          while :; do
            commits_json="$(api_get "https://api.github.com/repos/qualcomm-linux/kernel-topics/pulls/${pr}/commits?per_page=100&page=${page}")"
            count="$(jq 'length' <<< "${commits_json}")"
            jq -r '.[].sha' <<< "${commits_json}" >> "${commits_file}"
            [ "${count}" -lt 100 ] && break
            page=$((page + 1))
          done

          cat "${commits_file}"
        }

        cherry_pick_commits() {
          local label="$1"
          local commit
          shift

          if [ "$#" -eq 0 ]; then
            echo "No commits to cherry-pick from ${label}."
            return
          fi

          echo "Cherry-picking $# commit(s) from ${label} onto qcom-next"
          for commit in "$@"; do
            if ! git cherry-pick "${commit}"; then
              if git diff --quiet && git diff --cached --quiet; then
                echo "Skipping empty cherry-pick for ${commit} from ${label}"
                git cherry-pick --skip
              else
                echo "ERROR: cherry-pick failed for ${commit} from ${label}" >&2
                exit 1
              fi
            fi
          done
        }

        cherry_pick_pr() {
          local pr="$1"
          mapfile -t commits < <(get_pr_commits "${pr}")

          if [ "${#commits[@]}" -eq 0 ]; then
            echo "ERROR: no commits found to cherry-pick from kernel-topics PR #${pr}" >&2
            exit 1
          fi

          git fetch "https://x-access-token:${GH_TOKEN}@github.com/qualcomm-linux/kernel-topics.git" \
            "pull/${pr}/head:pr-${pr}"

          cherry_pick_commits "kernel-topics PR #${pr}" "${commits[@]}"
        }

        apply_topic_branch_delta() {
          local base_ref="$1"
          local upstream_tag

          git remote add kernel-topics \
            "https://x-access-token:${GH_TOKEN}@github.com/qualcomm-linux/kernel-topics.git"
          git fetch --no-tags kernel-topics \
            "refs/heads/${base_ref}:refs/remotes/kernel-topics/${base_ref}"
          git fetch --force kernel-topics '+refs/tags/v*:refs/tags/v*'

          upstream_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "refs/remotes/kernel-topics/${base_ref}" 2>/dev/null || true)"
          if [ -z "${upstream_tag}" ]; then
            echo "ERROR: could not determine upstream v* tag for kernel-topics branch ${base_ref}" >&2
            exit 1
          fi

          mapfile -t topic_commits < <(
            git rev-list --reverse --no-merges \
              "${upstream_tag}..refs/remotes/kernel-topics/${base_ref}"
          )

          echo "PR base branch ${base_ref} is based on upstream tag ${upstream_tag}."
          cherry_pick_commits "kernel-topics branch ${base_ref} after ${upstream_tag}" "${topic_commits[@]}"
        }

        get_pr_dependencies() {
          local pr="$1"
          local pr_json

          pr_json="$(api_get "https://api.github.com/repos/qualcomm-linux/kernel-topics/pulls/${pr}")"
          jq -r '.body // ""' <<< "${pr_json}" \
          | awk 'BEGIN { IGNORECASE=1 } /^Depends-on:/ { sub(/^Depends-on:[[:space:]]*/, ""); print }' \
          | tr ', \t\r' '\n' \
          | sed -nE \
              -e 's|^#([0-9]+)$|\1|p' \
              -e 's#^([0-9]+)$#\1#p' \
              -e 's#^https?://github.com/qualcomm-linux/kernel-topics/pull/([0-9]+).*#\1#p' \
              -e 's#^.*/pull/([0-9]+).*#\1#p' \
          | awk 'seen[$0]++ == 0'
        }

        target_pr="${{ inputs.pr_number }}"
        target_pr_json="$(api_get "https://api.github.com/repos/qualcomm-linux/kernel-topics/pulls/${target_pr}")"
        target_base_ref="$(jq -r '.base.ref // empty' <<< "${target_pr_json}")"
        if [ -z "${target_base_ref}" ]; then
          echo "ERROR: could not determine base branch for kernel-topics PR #${target_pr}" >&2
          exit 1
        fi

        apply_topic_branch_delta "${target_base_ref}"

        declare -A pr_state
        apply_pr_with_dependencies() {
          local pr="$1"
          local dependency_pr

          if [ "${pr_state[$pr]:-}" = "done" ]; then
            return
          fi
          if [ "${pr_state[$pr]:-}" = "visiting" ]; then
            echo "ERROR: circular Depends-on chain detected at kernel-topics PR #${pr}" >&2
            exit 1
          fi

          pr_state[$pr]=visiting
          mapfile -t dependency_prs < <(get_pr_dependencies "${pr}")
          for dependency_pr in "${dependency_prs[@]}"; do
            echo "Applying dependency PR #${dependency_pr} before PR #${pr}"
            apply_pr_with_dependencies "${dependency_pr}"
          done

          cherry_pick_pr "${pr}"
          pr_state[$pr]=done
        }

        apply_pr_with_dependencies "${target_pr}"

    - name: Fetch PR
      if: inputs.repo == 'qualcomm-linux/kernel'
      shell: bash
      run: |
        git checkout ${{ inputs.base_branch }}
        git fetch https://github.com/qualcomm-linux/kernel.git pull/${{inputs.pr_number}}/head:pr-${{inputs.pr_number}}
        git merge pr-${{ inputs.pr_number }} --no-commit || echo "Merge already applied or fast-forwarded"
        if ! git diff --cached --quiet; then
          git commit -m "Merged PR #${{ inputs.pr_number }}"
        else
          echo "Nothing to commit. PR may already be merged or fast-forwarded."
        fi

    - name: Set workspace path
      id: set-workspace
      shell: bash
      run: |
        if [[ "${{ inputs.repo }}" == "qualcomm-linux/kernel" ]]; then
          echo "workspace=${{ github.workspace }}" >> "$GITHUB_OUTPUT"
        else
          echo "workspace=${{ github.workspace }}/kernel" >> "$GITHUB_OUTPUT"
        fi
