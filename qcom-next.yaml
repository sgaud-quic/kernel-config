# qcom-next SHA-pinned topic configuration
#
# SINGLE SOURCE OF TRUTH for the content of the qcom-next integration tree.
#
#   qcom-next = f( base.sha , ordered topics[].sha , rerere cache revision )
#
# Rules:
#   * qcom-next is never hand-edited. It is published only by the
#     publication workflow, driven by this file.
#   * Every sha recorded here is a STABLE sha: it has passed the CI gates.
#   * Every sha must be reachable from a tag so it survives a topic rebase.
#   * Topic owners live in topic_maintainers.json, keyed by the topic name
#     below. Do not duplicate owner data here.
#   * Array order IS merge order and must respect depends_on.
#
# To promote a topic: open a PR changing only that topic's sha and tag.
# To uprev the kernel RC: open a PR changing only the base block.
# Validated by scripts/validate_qcom_next_config.py against
# schemas/qcom-next.schema.json.
#
# Bootstrapped from qcom-next.conf on 2026-10-17 by
# scripts/bootstrap_qcom_next_yaml.py (branch tips captured as the initial
# pinned SHAs).
#
# REMOVED during bootstrap: 1 topic(s) listed in the legacy conf
# no longer exist on their remote and were dropped (FR-INT-02). Restore the
# branch and re-add the entry if this was not intended:
#   - tech/debug/soc  (was qcom-next.conf:10, branch tech/debug/soc)
#
# NOTE: 76 topic(s) had no tag pointing at the captured tip at
# bootstrap time and carry 'tag: null'. Each must be tagged
# (<branch>-<kernel-version>-<YYYYMMDD>) before it can be promoted; the
# validator rejects a null tag unless --allow-untagged is passed.

schema_version: 1

# Upstream baseline. Changed only by an RC uprev PR (Phase A), which must
# leave every topic sha untouched.
base:
  repo: "https://github.com/qualcomm-linux/kernel.git"
  branch: qcom-next-staging
  tag: v7.3-rc6
  sha: a90ee4305c4a5df72c11b31dacfdc76e00fcf78a

# open   = topic promotions may publish
# frozen = RC uprev in progress; promotions may validate but not publish
promotion_state: open

# Shared rerere cache replayed during tree generation. Read-only in normal
# PR CI; updated by a topic maintainer only when resolving a conflict.
rerere_cache:
  repo: "https://github.com/sgaud-quic/cache"
  ref: master

